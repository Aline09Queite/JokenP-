<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>DevClub JokenPô</title>
</head>

<body>

    <div class="container">

        <h1>JokenPô</h1>

        <div class="buttons">
            <button id="rock" onclick="playHuman('rock')">&#x1F44A;</button>
            <button id="paper" onclick="playHuman('paper')">&#x1F590;</button>
            <button id="scissors" onclick="playHuman('scissors')">&#x270C;</button>

        </div>

        <div class="choices-container">
            <h2 class="feliz" onclick="playHuman('feliz')">&#x1F600;</h2>
            <h2 class="triste" onclick="playHuman('triste')">&#x1F61E;</h2>
            <h2 class="inconformado" onclick="playHuman('inconformado')">&#x1F644;</h2>
        </div>

        <div class="result"></div>

        <div>
            Humano: <span id="human-score">0</span> | Máquina: <span id="machine-score">0</span>
        </div>




        <p class="result"></p>


        <p class="you-score">Sua pontuação: <span id="human-score">0</span></p>
        <p class="machine-score">Sua da Alexa: <span id="machine-score">0</span></p>

    </div>
    <script src="script.js"></script>

</body>

</html>
